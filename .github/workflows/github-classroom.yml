name: GitHub Classroom Workflow

on: [push]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run tests
        run: mvn clean test
        env:
          # Configure Chrome to run in headless mode
          MAVEN_OPTS: "-Dwebdriver.chrome.args='--headless --no-sandbox --disable-dev-shm-usage --disable-gpu' -Dwebdriver.chrome.headless=true"

      - uses: education/autograding@v1
